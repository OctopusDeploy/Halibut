# The redis.conf Octopus Cloud uses for the Redis that backs the Halibut Redis Pending Request Queue.
# Keep this in sync with HostedScripts: source/HostedInstance/redis/redis-cache-configmap.yml
# The password is not set here, Octopus Cloud passes it with --requirepass.
#
# User-supplied common configuration:
# Disable AOF and RDB persistence as we keep everything in memory only, see https://redis.io/topics/persistence
appendonly no
# Disable RDB persistence, AOF persistence already enabled.
save ""
# Explicitly set the number of databases
databases 16
# End of common configuration
port 6379
dir /data
